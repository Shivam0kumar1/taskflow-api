# Name shown in GitHub's "Actions" tab
name: Run Tests

# This tells GitHub WHEN to run this workflow
on:
  push:
    branches: [ "**" ]        # run on every push, to any branch
  pull_request:
    branches: [ "main" ]      # also run when a PR targets main

jobs:
  test:
    # The virtual machine this job runs on (a fresh Ubuntu machine each time)
    runs-on: ubuntu-latest

    # Spins up a temporary PostgreSQL database just for this test run,
    # matching what your docker-compose.yml does locally
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Waits until postgres is actually ready to accept connections
        # before letting the rest of the job continue
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Downloads your repository's code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs Python on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Installs your project's dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Runs your existing test suite, pointing it at the temporary
      # postgres database created above instead of your real database
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          ALGORITHM: HS256
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test
          COOKIES_PASSWORD: ci-test-cookie-password
        run: python -m pytest -v

  deploy:
    # This job will only run if the "test" job above completes successfully
    needs: test

    #Only deploy when the push is to your production branch (master)
    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.FASTAPI_RENDER_DEPLOY_HOOK }}"

      - name: Trigger UI deploy
        run: curl -X POST "${{ secrets.UI_RENDER_DEPLOY_HOOK }}"
