services:
  postgres-test:
    image: postgres:17

    container_name: taskflow-test-db

    environment:
      POSTGRES_DB: taskflow_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

  db:
    image: postgres:17

    container_name: taskflow-dev-db

    environment:
      POSTGRES_DB: taskflow_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - taskflow-dev-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskflow_dev

    depends_on:
      - db

volumes:
  taskflow-dev-data: